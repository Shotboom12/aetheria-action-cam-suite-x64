
[CrashReporter]
; If true, the custom CrashReporter is shown, overwriting the original.
Enabled=0

[SeyrisPanels]
; If true, every other panel starts hidden and is opened from the launcher.
HideOthersOnStart=1
; If true, the F9 overlay shows a 'WXL panels' launcher listing every module's panel.
Launcher=1

[SeyrisEditor]
; If true, shows the cdbc table editor in the F9 debug overlay.
Enabled=0

[LivingAzeroth]
; Debug: draw the wind as arrows around the player.
DebugWindArrows=0
; Walls and cliffs cast a wind shadow on their downwind side.
WindLee=1
; Roofs and overhangs shelter the ground below from wind.
WindShelter=1
; How much darker soaked ground gets, 0..1: the terrain and the surface cover alike.
TerrainWetnessStrength=0.45
; The terrain itself looks darker where the ground is wet (rain, water nearby).
TerrainWetness=1
; Effects at units' feet (auras and other spell effects on the Base attachment) sit on top of the cover instead of under it (within 40 yards of you).
SurfaceCoverLiftEffects=1
; Snow (and other) cover on the ground that characters sink into and carve trenches in. Where and how comes from SurfaceCover.cdbc.
SurfaceCover=0
; How far the cover reaches: 1..5 rings of 40, 80, 160, 320, 640 yards.
SurfaceCoverLevels=5
; Characters and creatures carve trenches in the cover.
SurfaceCoverTrenches=1
; Your multiplier on the cover depth from SurfaceCover.cdbc (1 = as the table says).
SurfaceCoverDepth=1
; Milliseconds per frame spent filling the cover around you (on login, teleports, moving). Lower = smoother, slower to appear.
SurfaceCoverFillBudgetMs=2
; FXAA subpixel smoothing, 0 (sharpest) .. 1 (softest).
AntiAliasingSubpixel=0.75
; Our own anti-aliasing (FXAA). Turn the client's multisampling off to use it: readable depth (for fog etc.) needs it off.
AntiAliasing=1
; Extra push radius factor while mounted.
GrassMountedRadiusScale=2
; Smallest push radius in yards.
GrassMinPushRadius=0.5
; Push radius as a multiple of a character's bounding radius.
GrassPushRadiusScale=2
; How far grass leans away from characters, in yards.
GrassPushStrength=0.5
; Bottom fraction of each blade that never moves (0..0.9).
GrassStiffBase=0.15
; Shimmer speed in radians per second.
GrassFlutterSpeed=3
; Extra per-blade shimmer in yards.
GrassFlutter=0.08
; Grass tip movement in yards at full wind.
GrassSway=0.35
; Grass sways in the wind and parts around characters.
GrassMotion=1
; Share of plants drawn at GrassThinEnd and beyond (0.01 to 1).
GrassThinMinShare=0.25
; Yards from the camera where thinning reaches GrassThinMinShare.
GrassThinEnd=800
; Yards from the camera within which every plant is drawn.
GrassThinStart=150
; Instanced grass only: far grass draws fewer plants (an even sample), which saves a lot of GPU time at long grass distances.
GrassThinning=1
; Your limit on how far an extra plant may move from its plant, in yards.
GrassDensityMaxSpread=3
; Your limit on how far around you grass is made denser, in yards.
GrassDensityMaxRadius=150
; Instanced grass only: your limit on grass density (plants drawn per placed plant, 1 = never denser, up to 8). How dense comes from GroundEffectDoodadDensity.cdbc.
GrassDensityMaxMultiplier=4
; Most memory (MB) the instanced grass may use. It shares the client's 32-bit address space; too high can crash the client.
InstancedGrassMemoryMB=256
; Milliseconds per frame spent preparing grass coming into view; the rest is drawn the client's way until a later frame.
InstancedGrassBuildBudgetMs=3
; Instanced grass draws all visible grass layers together at the end of the grass pass (much less CPU time). 0 = one layer at a time.
InstancedGrassBatched=1
; Draw grass with the instanced renderer (much faster at long grass distances). 0 = the client's own path.
InstancedGrass=1
; Highest grass distance (groundEffectDist) the client accepts. The exe's own cap is 140; it's only raised, never lowered.
GrassDistanceCap=10000

; Preserved from previous WarcraftXL configuration.
; Instanced grass only: plant density near the player, as a multiplier (1 = off, up to 8).
GrassDensityMultiplier=1
; Yards around the player where the density multiplier applies.
GrassDensityRadius=60
; Yards an extra plant may sit from the plant it copies.
GrassDensitySpread=1

[LivingAzeroth.Fog]
; While fog is drawn, water writes depth so lakes are fogged at their surface (not their bed).
WaterWritesDepth=1
; Degrees: from this slope all of it runs off.
SteepFull=45
; Degrees: from this slope a growing share of the ground-hugging fog runs off (it doesn't hang on steep ground).
SteepStart=30
; How fast heavy fog (each kind's Weight share) runs downhill into hollows: 1 = default, 0 = it stays where it formed.
PoolSpeed=1
; How soft heavy fog's edges are, 0 (crisp top, sharp sides) .. 1: its top blurs over this share of its depth, thin pools fade out.
PoolSoftness=0.6
; Lights farther than this from the camera (yards) don't light the fog. Lower = cheaper.
LightRange=128
; Your multiplier on our lights' light in the fog.
LightStrength=1
; Our lights (torches, braziers, lamps) light the fog around them.
Lights=1
; Your multiplier on the fog's colour brightness.
Brightness=1
; Size of the patch pattern's tile in yards (the patches are about 1/8 of it).
PatchSize=64
; How patchy the fog is, 0 (smooth layers) .. 1.
Patchiness=0.6
; Light fog starts on the lowest ground this many 2-yard cells around (0..4): higher keeps it off walls, thins it on slopes.
FloorReach=2
; 0 = smooth (may show faint bands) .. 1 = grainy.
Dither=0
; Step length inside the fog near you, in yards (grows with distance). Smaller = finer, slower.
StepLength=0.25
; Steps per pixel through the fog (quality, not the look): more = smoother far away, slower.
StepBudget=48
; Draw the fog at half resolution, upscaled by depth (sharp at silhouettes): about a quarter of the GPU time.
HalfResolution=1
; Past MaxDistance, the far fog continues to the terrain drawn there (one long step, cheap).
BeyondMaxDistance=1
; Yards over which the near fog fades into the far fog at the near field's edge (~128 yd): wider = softer seam, less near detail.
HandoverWidth=64
; Doodads of size categories below this don't fade in but pop in, so the ground fog covers them (fading ones show unfogged): 0 = stock, 5 = none fade.
DoodadFadeFromCategory=3
; Doodads with a radius under 1 yd (mugs, plates) use the next size's view distance instead of a fixed 30 yd (more doodads drawn).
SmallDoodadsUseNextDistance=1
; Beyond 128 yards the fog continues at each zone's typical level (no wall where the near fog ends).
FarFog=1
; How far the fog is drawn, in yards.
MaxDistance=250
; Your multiplier on every fog kind's density (1 = as FogSettings.cdbc says).
DensityScale=1
; Draw the ground fog.
Enabled=0
; Compatibility build only: allow Modern Water and share its readable depth; 0 restores the original conflict block. Restart after changing.
ModernWaterCompatibility=1

[LivingAzeroth.FogWake]
; How far the fog's pattern is dragged and curled along the path.
Swirl=1
; Fog piled up at the wake's edge, as a share of the push.
Rim=0.25
; How high the push reaches, as a multiple of the unit's height.
Height=1
; How much the trail widens as it fades, times its radius.
Widening=1
; Wake radius as a multiple of the unit's radius (at least 0.6 yards).
Radius=2.25
; Seconds until a trail fills back in.
FillSeconds=3
; How much fog a standing unit pushes out, 0..1.
PushStanding=0.35
; How much fog a moving unit pushes out, 0..1.
PushMoving=0.9
; Characters and creatures push the ground fog aside and leave a swirling trail.
Enabled=1

; Preserved from previous WarcraftXL configuration.
[CrashHandler]
; Display a register/stack dump MessageBox on unhandled exceptions.
Enabled=1
